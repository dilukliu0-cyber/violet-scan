name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          for p in \
            /Applications/Xcode_16.4.app/Contents/Developer \
            /Applications/Xcode_16.3.app/Contents/Developer \
            /Applications/Xcode_16.2.app/Contents/Developer \
            /Applications/Xcode_16.1.app/Contents/Developer \
            /Applications/Xcode_16.0.app/Contents/Developer \
            /Applications/Xcode_16.app/Contents/Developer \
            /Applications/Xcode.app/Contents/Developer; do
            if [ -d "$p" ]; then
              sudo xcode-select -s "$p"
              break
            fi
          done
          xcodebuild -version
          ls /Applications | grep -i Xcode || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          xcodebuild -list -project VioletScan.xcodeproj

      - name: Build (unsigned device .app)
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project VioletScan.xcodeproj \
            -scheme VioletScan \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find build/DerivedData/Build/Products -name 'VioletScan.app' -type d | head -n 1)
          echo "Found app: $APP"
          test -n "$APP"
          rm -rf build/Payload build/VioletScan-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qr VioletScan-unsigned.ipa Payload)
          ls -lh build/VioletScan-unsigned.ipa
          unzip -Z1 build/VioletScan-unsigned.ipa | head -40

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VioletScan-unsigned-ipa
          path: build/VioletScan-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
